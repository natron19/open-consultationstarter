# GRADE Goal: turn a meeting brief into a five-section Consultation Plan where every
# section maps to the Seven Principles of Consultation. "Good" = all five sections,
# exactly three success criteria and five facilitator prompts, only real principle names.
# Top concerns: the plan must foster genuine participation (dissent, unheard voices),
# stay neutral rather than presupposing the decision, and never name participants in public fields.
template: consultationstarter_meeting_plan_v1

rubric:
  - dimension: useful
    criterion: The plan fosters genuine participation. Its questions and prompts draw out dissent and unheard voices rather than steering toward agreement.
  - dimension: accurate
    criterion: The plan is neutral. It frames the decision as open and does not presuppose or favor any of the options described in the input.
  - dimension: accurate
    criterion: The plan is grounded in the input. It invents no facts, data, or options the input does not support.
  - dimension: safe
    criterion: No participant is named in the purpose statement, success criteria, pre-meeting questions, or facilitator prompts.

# Note: the system prompt only requires six of the seven principles to appear (Unity of
# Purpose has no dedicated slot), so contains_all checks those six, and values_in makes
# sure no invented principle names are used.
cases:
  - id: golden_budget_reallocation
    kind: golden
    segment: team_lead
    variables:
      topic: Reallocate Q1 marketing budget after the channel mix audit
      decision_paragraph: Paid social underperformed while organic content and partnerships outperformed. We must decide whether to shift about 40 percent of paid social into those channels, hold steady for another month of data, or exit paid social through Q2.
      duration_minutes: 60
      participants_list: "- Maya (Head of Marketing)\n- Devon (Performance Marketing Lead)\n- Priya (Brand and Content Lead)"
      context: Last quarter we held steady against weak data and lost two months. Two people disagreed publicly and asked whether their dissent was considered.
    checks:
      - { type: json_valid }
      - { type: has_keys, keys: [purpose_statement, success_criteria, pre_meeting_questions, facilitator_prompts, decision_record_template] }
      - { type: count_between, path: success_criteria, min: 3, max: 3 }
      - { type: count_between, path: pre_meeting_questions, min: 3, max: 5 }
      - { type: count_between, path: facilitator_prompts, min: 5, max: 5 }
      - { type: each_has_keys, path: pre_meeting_questions, keys: [question, principle] }
      - { type: each_has_keys, path: facilitator_prompts, keys: [order, principle, prompt, when_to_use] }
      - type: contains_all
        dimension: accurate
        values: ["Spirit of Service", "Detachment from Personal Views", "Frankness with Courtesy", "Equality of Voice", "Search for Truth", "Unity in Action"]
      - type: values_in
        dimension: accurate
        path: facilitator_prompts
        field: principle
        allowed: ["Spirit of Service", "Spirit of Service and Adding Value", "Unity of Purpose", "Detachment from Personal Views", "Frankness with Courtesy", "Equality of Voice", "Search for Truth", "Unity in Action"]
      - type: values_in
        dimension: accurate
        path: pre_meeting_questions
        field: principle
        allowed: ["Spirit of Service", "Spirit of Service and Adding Value", "Unity of Purpose", "Detachment from Personal Views", "Frankness with Courtesy", "Equality of Voice", "Search for Truth", "Unity in Action"]
      - { type: contains_all, values: ["Decision", "Rationale", "Dissent Considered", "Commitments"] }

